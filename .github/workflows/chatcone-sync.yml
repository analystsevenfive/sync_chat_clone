name: 🔄 Chatcone Daily Sync (19:30 ICT)

on:
  schedule:
    # รันอัตโนมัติทุกวัน เวลา 19:30 น. (เวลาไทย UTC+7 = 12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch: # อนุญาตให้กดปุ่ม "Run workflow" สั่งรันได้ทันทีจากหน้าเว็บ GitHub

jobs:
  sync-to-sheets:
    name: Sync Messages to Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Run Sync Script
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          CHATCONE_TOKEN: ${{ secrets.CHATCONE_TOKEN }}
          CHATCONE_AGENT_ID: ${{ secrets.CHATCONE_AGENT_ID }}
          CHATCONE_USERNAME: ${{ secrets.CHATCONE_USERNAME }}
          CHATCONE_PASSWORD: ${{ secrets.CHATCONE_PASSWORD }}
        run: |
          echo "🚀 เริ่มต้นการซิงค์ข้อมูลจาก Chatcone เข้าสู่ Google Sheets (รอบ 19:30 น.)..."
          node sync-now.js
